server:
  port: 8080

spring:
  application:
    name: pineapplepizza

  sql:
    init:
      mode: always

  datasource:
    url: jdbc:h2:mem:balancedb
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  h2:
    console:
      enabled: true
      path: /h2-console
